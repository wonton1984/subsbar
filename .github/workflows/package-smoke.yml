name: package-smoke

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: package-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # actions/checkout@v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: build app bundle
        run: ./macos-app/build-app.sh | tee /tmp/build-out.txt
      - name: bundle content checks (hashes, plist, bundled engine)
        run: |
          APP="$(grep '^App: ' /tmp/build-out.txt | head -1 | cut -d' ' -f2-)"
          test -n "$APP" || { echo "could not derive app path from build output"; exit 1; }
          test -f "$APP/Contents/Info.plist"
          grep -q LSUIElement "$APP/Contents/Info.plist"
          test -f "$APP/Contents/Resources/core.sha256"
          (cd "$APP/Contents/Resources" && shasum -a 256 -c core.sha256)
          test -x "$APP/Contents/Resources/core/cli.mjs"
          test -d "$APP/Contents/Resources/schemas"
          test -f "$APP/Contents/Resources/LICENSE"
          ! find "$APP" -name "*.png" | grep -q . || { echo "unexpected png in bundle"; exit 1; }
      - name: bundled CLI smoke in temp HOME (with spaces in path)
        run: |
          APP="$(grep '^App: ' /tmp/build-out.txt | head -1 | cut -d' ' -f2-)"
          SMOKE="$HOME/SubsBar Smoke Test"
          mkdir -p "$SMOKE" "$SMOKE/.cache/subsbar" "$SMOKE/.config/subsbar" "$SMOKE/.local/state/subsbar"
          cp -R "$APP" "$SMOKE/"
          HOME="$SMOKE" XDG_CACHE_HOME="$SMOKE/.cache" XDG_CONFIG_HOME="$SMOKE/.config" XDG_STATE_HOME="$SMOKE/.local/state" \
            node "$SMOKE/SubsBar.app/Contents/Resources/core/cli.mjs" usage --json > /tmp/usage-out.json
          node -e "const d=JSON.parse(require('fs').readFileSync('/tmp/usage-out.json','utf8'));if(d.kind!=='usage'||d.schemaVersion!==1)process.exit(1);console.log('bundled CLI smoke ok (path with spaces):', d.providers.length, 'providers');"
      - name: verify strict codesign
        run: |
          APP="$(grep '^App: ' /tmp/build-out.txt | head -1 | cut -d' ' -f2-)"
          codesign --verify --strict "$APP"
