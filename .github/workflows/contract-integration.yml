name: contract-integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: contract-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout@v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # actions/setup-node@v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: golden runner determinism
        run: |
          node core/golden.mjs --input test/fixtures/ipc/usage-golden-vectors.json --output /tmp/golden-out.json
          diff /tmp/golden-out.json test/fixtures/ipc/usage-golden-normalized.json
      - name: CLI consumes synthetic cache (temp XDG home, no credentials)
        run: |
          export HOME=$(mktemp -d)
          mkdir -p "$HOME/.config/subsbar" "$HOME/.cache/subsbar" "$HOME/.local/state/subsbar"
          node examples/config.example.json >/dev/null 2>&1 || true
          cp examples/config.example.json "$HOME/.config/subsbar/config.json"
          # synthetic usage cache in the XDG cache location
          node -e '
            const { writeFileSync } = require("fs");
            const vectors = JSON.parse(require("fs").readFileSync("test/fixtures/ipc/usage-golden-normalized.json", "utf8"));
            const out = vectors.vectors["zero"].output;
            const envelope = { schemaVersion: 1, kind: "usage", contextId: "ci", generatedAtMs: Date.now(), cacheRevision: 0,
              providers: [{ providerId: "commandcode", profileId: "personal", status: "ok", freshness: "fresh",
                dataDisposition: "current", attempt: { state: "succeeded" }, diagnostics: [],
                report: { name: "CommandCode", capturedAtMs: Date.now(), observationBasis: "remote-response",
                  windows: [{ id: "monthly-credits", ruleId: "monthly-credits", label: "月度credits", kind: "quota",
                    state: "known", unit: "percent", used: 0, limit: 100, scope: "subscription", provenance: "reported",
                    sourceEndpointIds: [], quotaState: "within-limit", derivations: [], period: { kind: "unknown", resetState: "unknown" }, diagnostics: [] }],
                  metrics: [], primaryMetricId: "monthly-credits", diagnostics: [] } }], diagnostics: [] };
            writeFileSync(process.env.HOME + "/.cache/subsbar/usage-v1.json", JSON.stringify(envelope));
          '
          node core/cli.mjs usage --json > /tmp/usage-out.json
          node -e '
            const d = JSON.parse(require("fs").readFileSync("/tmp/usage-out.json", "utf8"));
            if (d.kind !== "usage" || d.schemaVersion !== 1) process.exit(1);
            const cc = d.providers.find(p => p.providerId === "commandcode");
            if (!cc || cc.status !== "ok") process.exit(1);
            console.log("contract-integration: CLI consumed synthetic cache, status ok");
          '
      - name: schema conformance of shipped manifests (structural)
        run: node -e '
          const fs = require("fs");
          const req = JSON.parse(fs.readFileSync("schemas/provider-manifest-v1.schema.json", "utf8")).required;
          for (const f of fs.readdirSync("core/providers/manifests")) {
            const m = JSON.parse(fs.readFileSync("core/providers/manifests/" + f, "utf8"));
            for (const k of req) if (!(k in m)) throw new Error(f + " missing " + k);
          }
          console.log("manifests structurally conform");
        '
